<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captcha Solver — tester</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
         background:#0d0f12; color:#d7dde5; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { color:#7c8899; margin:0 0 20px; font-size:13px; }
  .grid { display:grid; gap:14px; max-width:820px; }
  #drop { border:2px dashed #2a3138; border-radius:10px; padding:34px;
          text-align:center; color:#7c8899; cursor:pointer; transition:.15s; }
  #drop.hot { border-color:#3d9be9; color:#3d9be9; background:#111a22; }
  #preview { max-width:100%; max-height:220px; display:none; border-radius:8px; background:#fff; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input, select, button { font:inherit; background:#161a1f; color:#d7dde5;
          border:1px solid #2a3138; border-radius:7px; padding:8px 10px; }
  button { cursor:pointer; }
  button.primary { background:#1d6fb8; border-color:#1d6fb8; color:#fff; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  pre { background:#11151a; border:1px solid #22282f; border-radius:8px; padding:12px;
        white-space:pre-wrap; word-break:break-all; min-height:60px; margin:0; }
  .muted { color:#7c8899; font-size:12px; }
</style>
</head>
<body>
<h1>Captcha Solver — tester</h1>
<p class="sub">Drop, paste (Ctrl+V) or pick an image. Calls <code>POST /api/image</code>.</p>

<div class="grid">
  <div id="drop" tabindex="0">Drop image here · click to browse · or paste
    <input id="file" type="file" accept="image/*" hidden>
  </div>
  <img id="preview" alt="">
  <div class="row">
    <label class="muted">charset
      <select id="chars">
        <option value="">auto (all)</option>
        <option value="alnum">alnum</option>
        <option value="digits">digits</option>
        <option value="lower">lowercase</option>
        <option value="alpha">letters</option>
      </select>
    </label>
    <label class="muted">length <input id="length" type="number" min="1" max="20" style="width:70px"></label>
    <button id="go" class="primary" disabled>Solve</button>
    <button id="copy" disabled>Copy answer</button>
  </div>
  <pre id="out">—</pre>
</div>

<script>
const drop = document.getElementById('drop');
const fileInput = document.getElementById('file');
const preview = document.getElementById('preview');
const go = document.getElementById('go');
const copy = document.getElementById('copy');
const out = document.getElementById('out');
let blob = null;

function load(file) {
  if (!file || !file.type.startsWith('image/')) return;
  blob = file;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  go.disabled = false;
  out.textContent = '—';
}

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('keydown', e => { if (e.key === 'Enter') fileInput.click(); });
fileInput.addEventListener('change', e => load(e.target.files[0]));
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hot'); });
drop.addEventListener('dragleave', () => drop.classList.remove('hot'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('hot'); load(e.dataTransfer.files[0]);
});
window.addEventListener('paste', e => {
  for (const item of e.clipboardData.items) {
    if (item.type.startsWith('image/')) load(item.getAsFile());
  }
});

go.addEventListener('click', async () => {
  if (!blob) return;
  go.disabled = true;
  out.textContent = 'solving…';
  const qs = new URLSearchParams();
  const chars = document.getElementById('chars').value;
  const length = document.getElementById('length').value;
  if (chars) qs.set('chars', chars);
  if (length) qs.set('length', length);
  const fd = new FormData();
  fd.append('file', blob, 'captcha.png');
  const t0 = performance.now();
  try {
    const res = await fetch('/api/image?' + qs.toString(), { method: 'POST', body: fd });
    const text = await res.text();
    let shown;
    try { shown = JSON.stringify(JSON.parse(text), null, 2); } catch { shown = text; }
    out.textContent = `HTTP ${res.status} · ${Math.round(performance.now() - t0)} ms\n\n${shown}`;
    try { copy.dataset.answer = JSON.parse(text).text || ''; copy.disabled = !copy.dataset.answer; }
    catch { copy.disabled = true; }
  } catch (err) {
    out.textContent = 'network error: ' + err;
  } finally {
    go.disabled = false;
  }
});

copy.addEventListener('click', () => {
  if (copy.dataset.answer) navigator.clipboard.writeText(copy.dataset.answer);
});
</script>
</body>
</html>
